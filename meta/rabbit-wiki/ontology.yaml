concepts:
  - id: llm-wiki-pattern
    label: LLM Wiki (Karpathy pattern)
    description: >-
      A pattern where an LLM incrementally builds and maintains a persistent,
      structured markdown wiki from ingested sources, rather than re-deriving
      synthesis from raw documents at every query.
    sources: [2026-09-15-llm-wiki]
  - id: knowledge-graph
    label: Knowledge Graph
    description: >-
      A knowledge base using a graph-structured data model to represent
      interlinked entities and the semantics/relationships between them,
      optionally with an ontology supporting reasoning.
    sources: [2026-09-15-knowledge-graph]
  - id: twelve-factor-app
    label: Twelve-Factor App
    description: >-
      A methodology (Heroku, Adam Wiggins) of twelve declarative principles
      for building portable, cleanly scaling cloud-native SaaS applications.
    sources: [2026-09-15-twelve-factor-app]
  - id: sixteen-factor-app
    label: Sixteen-Factor App
    description: >-
      Google Cloud's extension of the Twelve-Factor App methodology with four
      additional factors for generative-AI applications: prompts as code,
      state as a service, observability for non-determinism, and trust and
      safety by design.
    sources: [2026-09-15-twelve-to-sixteen-factor-app]
  - id: client-requirements-2026-09
    label: Yugastore Client Requirements (2026-09)
    description: >-
      Three business-level feature requests from the Yugastore product owner:
      bottleneck-free experimentation, graceful service degradation, and
      pricing agility without redeploys.
    sources: [2026-09-15-client-requirements-interview]
  - id: ai-sdlc-bootstrap-decision
    label: AI-SDLC Bootstrap Adoption
    description: >-
      The team's decision to bootstrap the Yugastore repo with the
      opinionated, all-in-one AI-SDLC framework variant rather than a minimal
      grab-bag alternative or a bespoke spec framework.
    sources: [2026-09-15-meeting-with-young-chul-kim]
  - id: yugastore-delivery-team
    label: Yugastore Delivery Team Roster
    description: >-
      The named participants (Jack Murphy, Michael Apfelbeck, Young Chul Kim)
      behind the AI-SDLC bootstrap and related MCP/GitHub tooling setup for
      this repo.
    sources: [2026-09-15-team-rabbit-mode]
  - id: architecture-assessment-actionability-feedback
    label: Architecture Assessment Actionability Feedback
    description: >-
      Client feedback that architecture-assessment Likert scores need a
      visible gap callout, roses-and-thorns quick-fix guidance tied to
      sixteen-factor criteria, deeper future-state rationale, T-shirt sizing,
      risk categorization to avoid wholesale refactors, and human-vs-agent
      time-on-task estimates.
    sources: [2026-09-15-architecture-assessment-recap-part-1]
  - id: future-state-foundational-posture-scoring
    label: Sixteen-Factor Foundational Posture Scoring
    description: >-
      Proposal to extend future-state recommendations with weakness, cost,
      and risk estimates, compare skill-tailored vs untailored recommendation
      quality, and roll findings into a broader sixteen-factor foundational
      posture score across client tiers.
    sources: [2026-09-15-architecture-assessment-recap-part-2]
relations:
  - id: llm-wiki-pattern-related-to-knowledge-graph
    type: related_to
    from: llm-wiki-pattern
    to: knowledge-graph
    description: >-
      Both are structured, interlinked representations of accumulated
      knowledge; the LLM wiki is an informal, markdown-native analogue of a
      formal knowledge graph, and approaches like GraphRAG blend the two.
  - id: sixteen-factor-app-extends-twelve-factor-app
    type: extends
    from: sixteen-factor-app
    to: twelve-factor-app
    description: >-
      The sixteen-factor app keeps all twelve original factors and adds four
      more (prompts as code, state as a service, observability for
      non-determinism, trust and safety by design) for AI applications.
  - id: ai-sdlc-bootstrap-decision-related-to-client-requirements-2026-09
    type: related_to
    from: ai-sdlc-bootstrap-decision
    to: client-requirements-2026-09
    description: >-
      The AI-SDLC bootstrap was sequenced specifically so the client
      requirements interview (and this meeting) could be fed into the
      resulting knowledge base.
  - id: yugastore-delivery-team-related-to-ai-sdlc-bootstrap-decision
    type: related_to
    from: yugastore-delivery-team
    to: ai-sdlc-bootstrap-decision
    description: >-
      The same three people named in the roster ran the AI-SDLC bootstrap
      setup call.
  - id: architecture-assessment-actionability-feedback-related-to-future-state-foundational-posture-scoring
    type: related_to
    from: architecture-assessment-actionability-feedback
    to: future-state-foundational-posture-scoring
    description: >-
      Recap 1 and Recap 2 are one continuous client feedback conversation on
      the architecture-assessment/future-state deliverable, split across two
      recordings.
  - id: architecture-assessment-actionability-feedback-related-to-sixteen-factor-app
    type: related_to
    from: architecture-assessment-actionability-feedback
    to: sixteen-factor-app
    description: >-
      The requested quick-fix and remediation guidance is tied to specific
      sixteen-factor criteria.
  - id: future-state-foundational-posture-scoring-related-to-sixteen-factor-app
    type: related_to
    from: future-state-foundational-posture-scoring
    to: sixteen-factor-app
    description: >-
      The proposed foundational posture score is a roll-up of sixteen-factor
      based assessments across client tiers.
categories: []
