  - id: architecture-overview
    category: architecture
    path: docs/architecture/overview.md
    summary: |
      Seven-module Maven reactor: eureka-server-local, react-ui, api-gateway-microservice,
      products-microservice, cart-microservice, checkout-microservice, login-microservice.
      Gateway is the sole UI-facing surface and fans out via REST clients discovered through
      Eureka; no fallback/circuit-breaker logic observed. login-microservice has no gateway client.
    source_paths:
