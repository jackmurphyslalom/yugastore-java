    summary: |
      Yugastore is a Spring Boot + React sample e-commerce app on YugabyteDB (YSQL/YCQL), and is
      also the active working project for a 3-day AI Immersion exercise by Team Rabbit Mode.
      Pricing lives directly on the product record; login-microservice is unfinished and not
      wired into the gateway.
