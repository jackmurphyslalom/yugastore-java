<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="../base.css">
    <title>Intent Map</title>
  </head>
  <body>
    <section class="slide" aria-label="Intent map slide" data-slide="11">
      <p class="kicker">Explain systems</p>
      <h2>Map the ecosystem around the decision center</h2>
      <div class="intent-map">
        <div class="intent-map__ring" aria-hidden="true"></div>
        <div class="intent-map__center">Target operating rhythm</div>
        <div class="intent-map__node pos-top">Leadership visibility</div>
        <div class="intent-map__node pos-right accent-cyan">Seller experience</div>
        <div class="intent-map__node pos-bottom-right accent-purple">Process standards</div>
        <div class="intent-map__node pos-bottom-left accent-chartreuse">Enablement loops</div>
        <div class="intent-map__node pos-left accent-coral">Data quality</div>
      </div>
      <div class="footer"><span>Copyright 2026 Slalom. All Rights Reserved. Proprietary and Confidential.</span><span>11</span></div>
