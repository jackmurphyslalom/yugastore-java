# Test profile: replaces PostgreSQL with H2 so the Spring context can boot in CI
# without any external services.
spring:
  datasource:
    url: jdbc:h2:mem:login-test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate.dialect: org.hibernate.dialect.H2Dialect
    show-sql: false
