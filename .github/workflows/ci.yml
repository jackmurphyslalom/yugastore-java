name: CI

on:
  push:
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java-reactor:
    runs-on: ubuntu-latest
    needs: []
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run reactor unit tests
        run: ./mvnw -B -ntp -DskipTests=false test
      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/**'

  react-ui:
    runs-on: ubuntu-latest
    needs: []
    defaults:
      run:
        working-directory: react-ui/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 16.13.2
          cache: npm
          cache-dependency-path: react-ui/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      # No React test files exist yet (US2, #44); this Jest version exits 0 on "No tests found".
      - name: Run React UI tests
        run: npm test -- --coverage --watchAll=false --ci